  <text x="110" y="55" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SNACK PRODUCTS</text>
  <text x="110" y="64" font-family="Arial, sans-serif" font-size="7" font-weight="600" fill="#FDE047" text-anchor="middle" letter-spacing="1">DADA NAGAR · KANPUR</text>
