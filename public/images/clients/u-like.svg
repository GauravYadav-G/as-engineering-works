  <text x="110" y="42" font-family="Arial Black, Impact, sans-serif" font-size="26" font-weight="900" fill="#7C2D12" text-anchor="middle" letter-spacing="2">U-LIKE</text>
  <text x="110" y="40" font-family="Arial Black, Impact, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">U-LIKE</text>
  
