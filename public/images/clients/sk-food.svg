<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80">
  <defs>
    <linearGradient id="sk-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="sk-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="sk-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#sk-shadow)">
    <!-- Outer Shield / Cartouche -->
    <rect x="15" y="8" width="190" height="64" rx="10" fill="url(#sk-blue)" stroke="url(#sk-gold)" stroke-width="2.5"/>
    <rect x="19" y="12" width="182" height="56" rx="7" fill="none" stroke="#FDE047" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
    
    <!-- Monogram seal on left -->
    <circle cx="44" cy="40" r="20" fill="none" stroke="url(#sk-gold)" stroke-width="2"/>
    <circle cx="44" cy="40" r="17" fill="#1E293B"/>
    <text x="44" y="46" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="url(#sk-gold)" text-anchor="middle" letter-spacing="1">SK</text>
    
    <!-- Brand title -->
    <text x="122" y="34" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="url(#sk-gold)" text-anchor="middle" letter-spacing="1.2">S.K. FOODS</text>
    <line x1="75" y1="40" x2="170" y2="40" stroke="url(#sk-gold)" stroke-width="1" opacity="0.8"/>
    
    <!-- Subtitle banner -->
    <text x="122" y="51" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">BIKANERI NAMKEEN &amp; SWEETS</text>
    <text x="122" y="61" font-family="Arial, sans-serif" font-size="7" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="1">DELHI · KANPUR</text>
  </g>
</svg>